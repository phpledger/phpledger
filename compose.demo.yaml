name: phpledger-demo
services:
  demo-proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PL_DEMO_PORT:-18202}:80"
    volumes:
      - ./docker/shared-demo-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      shared:
        ipv4_address: ${PL_DEMO_INTERNAL_PROXY_IP:-10.204.83.10}
      edge: {}
    depends_on:
      - demo-web
  demo-web:
    image: ${PL_DEMO_IMAGE:?Set the verified release image and digest}
    entrypoint: ["apache2-foreground"]
    restart: unless-stopped
    networks: [shared]
    environment:
      PL_ENV: demo-install
      PL_BASE_PATH: /demo
      PL_DB_HOST: demo-db
      PL_DB_NAME: phpledger_demo
      PL_DB_USER: ledger_demo_web
      PL_DB_PASSWORD: ${PL_DEMO_WEB_PASSWORD:?Set a dedicated demo runtime password}
      PL_TRUSTED_PROXY_IPS: ${PL_DEMO_INTERNAL_PROXY_IP:-10.204.83.10}
      PL_DEMO_LOCAL_HTTP: ${PL_DEMO_LOCAL_HTTP:-0}
      PL_PUBLIC_URL: ${PL_DEMO_PUBLIC_URL:-https://phpledger.com/demo}
      PL_ALLOWED_ORIGINS: ${PL_ALLOWED_ORIGINS:-}
      PL_OAUTH_KEY_DIRECTORY: /var/lib/phpledger/runtime/oauth
      PL_INSTALL_DIRECTORY: /var/lib/phpledger/runtime/installation
      PL_INSTALL_CONFIG_PATH: /var/lib/phpledger/runtime/config.local.php
      PL_SAMPLE_PACKAGE_DIRECTORY: /opt/phpledger-demo/samples
      PL_SAMPLE_PACKAGES_READONLY: "1"
      PL_UPDATE_PUBLIC_KEY: /opt/phpledger-demo/publisher.pem
    volumes:
      - ${PL_DEMO_SAMPLE_DIRECTORY:?Set the signed sample preload directory}:/opt/phpledger-demo/samples:ro
      - ./resources/release/publisher-public.pem:/opt/phpledger-demo/publisher.pem:ro
      - ./docker/demo-apache.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./docker/shared-demo-guard.php:/opt/phpledger-demo/request-guard.php:ro
      - ./docker/shared-demo.ini:/usr/local/etc/php/conf.d/shared-demo.ini:ro
      - shared_demo_private:/var/lib/phpledger
    depends_on:
      demo-db:
        condition: service_healthy
    init: true
  demo-db:
    image: mysql:8.4
    networks: [shared]
    restart: unless-stopped
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${PL_DEMO_ROOT_PASSWORD:?Set a dedicated demo database root password}
      PL_DEMO_WEB_PASSWORD: ${PL_DEMO_WEB_PASSWORD:?Set a dedicated demo runtime password}
      PL_DEMO_RESET_PASSWORD: ${PL_DEMO_RESET_PASSWORD:?Set a dedicated scheduler password}
    volumes:
      - shared_demo_data:/var/lib/mysql
      - ./docker/demo-db-init.sh:/docker-entrypoint-initdb.d/01-demo-users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
  demo-reset:
    image: ${PL_DEMO_IMAGE:?Set the verified release image and digest}
    user: "0:0"
    healthcheck:
      disable: true
    profiles: ["maintenance"]
    networks: [shared]
    environment:
      PL_ENV: demo-install
      PL_DB_HOST: demo-db
      PL_DB_NAME: phpledger_demo
      PL_DB_USER: ledger_demo_reset
      PL_DB_PASSWORD: ${PL_DEMO_RESET_PASSWORD:?Set a dedicated scheduler password}
      PL_DEMO_RESET_MODE: "1"
    volumes:
      - ./tools/shared-demo-reset.php:/var/www/phpledger/tools/shared-demo-reset.php:ro
      - ./tools/shared-demo-scheduler.sh:/var/www/phpledger/tools/shared-demo-scheduler.sh:ro
      - shared_demo_private:/var/lib/phpledger
    depends_on:
      demo-db:
        condition: service_healthy
    entrypoint: ["php", "tools/shared-demo-reset.php"]
  demo-scheduler:
    extends:
      service: demo-reset
    profiles: []
    restart: unless-stopped
    entrypoint: ["sh", "tools/shared-demo-scheduler.sh"]
volumes:
  shared_demo_data:
  shared_demo_private:
networks:
  edge: {}
  shared:
    name: ${COMPOSE_PROJECT_NAME:-phpledger-demo}_shared_install
    internal: true
    ipam:
      config:
        - subnet: ${PL_DEMO_DOCKER_SUBNET:-10.204.83.0/24}
