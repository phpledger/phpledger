name: phpledger
services:
  web:
    build:
      context: .
      args:
        PHP_VERSION: ${PL_PHP_VERSION:-8.3.33}
    ports:
      - "127.0.0.1:${PL_WEB_PORT:-18200}:80"
    environment:
      PL_ENV: local
      PL_DB_HOST: db
      PL_DB_PORT: 3306
      PL_DB_NAME: phpledger
      PL_DB_USER: phpledger
      PL_DB_PASSWORD: ${PL_DB_PASSWORD:?Set PL_DB_PASSWORD in .env}
      PL_DB_PREFIX: ${PL_DB_PREFIX:-}
      PL_DB_SSL_CA: ${PL_DB_SSL_CA:-}
      PL_DB_SSL_VERIFY: ${PL_DB_SSL_VERIFY:-true}
      PL_DB_SSL_CERT: ${PL_DB_SSL_CERT:-}
      PL_DB_SSL_KEY: ${PL_DB_SSL_KEY:-}
      PL_SESSION_SECURE: "0"
      PL_PUBLIC_URL: http://127.0.0.1:${PL_WEB_PORT:-18200}
      PL_ALLOWED_ORIGINS: ${PL_ALLOWED_ORIGINS:-}
      PL_OAUTH_KEY_DIRECTORY: /var/lib/phpledger/oauth
    volumes:
      - ./www:/var/www/phpledger/www:ro
      - ./tests:/var/www/phpledger/tests:ro
      - ./tools:/var/www/phpledger/tools:ro
      - ./resources:/var/www/phpledger/resources:ro
      - ledger_private:/var/lib/phpledger:ro
    depends_on:
      db:
        condition: service_healthy
    init: true
  website:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${PL_WEBSITE_PORT:-18201}:80"
    volumes:
      - ./www/website/public:/usr/share/nginx/html:ro
      - ./docker/website.conf:/etc/nginx/conf.d/default.conf:ro
    init: true
  db:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: phpledger
      MYSQL_USER: phpledger
      MYSQL_PASSWORD: ${PL_DB_PASSWORD:?Set PL_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${PL_DB_ROOT_PASSWORD:?Set PL_DB_ROOT_PASSWORD in .env}
    volumes:
      - ledger_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  db_test:
    # MySQL 8.4 by default; set PL_TEST_DB_IMAGE=mariadb:10.11 (for example) to run the same tests on MariaDB.
    image: ${PL_TEST_DB_IMAGE:-mysql:8.4}
    command: ["--log-bin-trust-function-creators=1"]
    profiles: ["test"]
    environment:
      MYSQL_DATABASE: phpledger_test
      MYSQL_USER: ledger_test
      MYSQL_PASSWORD: local-test-only
      MYSQL_ROOT_PASSWORD: local-test-root-only
      MARIADB_DATABASE: phpledger_test
      MARIADB_USER: ledger_test
      MARIADB_PASSWORD: local-test-only
      MARIADB_ROOT_PASSWORD: local-test-root-only
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent || mariadb-admin ping -h 127.0.0.1 -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  test:
    build:
      context: .
      args:
        PHP_VERSION: ${PL_PHP_VERSION:-8.3.33}
    profiles: ["test"]
    environment:
      PL_ENV: test
      PL_DB_HOST: db_test
      PL_DB_NAME: phpledger_test
      PL_DB_USER: ledger_test
      PL_DB_PASSWORD: local-test-only
    volumes:
      - ./www:/var/www/phpledger/www:ro
      - ./tests:/var/www/phpledger/tests:ro
      - ./tools:/var/www/phpledger/tools:ro
      - ./resources:/var/www/phpledger/resources:ro
    depends_on:
      db_test:
        condition: service_healthy
    command: ["composer", "check"]
volumes:
  ledger_data:
  ledger_private:
networks:
  default:
    ipam:
      config:
        - subnet: ${PL_DOCKER_SUBNET:-10.203.82.0/24}
