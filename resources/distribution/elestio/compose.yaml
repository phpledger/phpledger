# Submission reference for Elestio (elest.io). Elestio has no public packaging
# specification confirmed from its own documentation: it builds and manages each
# deployment itself, and new applications are added through informal outreach to
# their team, not a pull request against an open manifest schema (see NOTES.md).
# This compose file is the "here is a working deployment" attachment for that
# outreach: a maintainer takes it as-is or adapts it into whatever internal
# format Elestio uses. It reproduces compose.production.yaml (repository root)
# exactly: image pinned to 1.4.0 (never :latest), app on 8080 internally, MySQL
# 8.4 with --log-bin-trust-function-creators=1, the private volume at
# /var/lib/phpledger, and the full PL_* environment contract.
#
# No secret is hardcoded. PL_DB_PASSWORD and PL_DB_ROOT_PASSWORD have no default
# and must be supplied by the operator or Elestio's own credential generator;
# every other variable follows compose.production.yaml's own default/blank
# convention.

name: phpledger
services:
  web:
    image: ghcr.io/phpledger/phpledger:1.4.0
    restart: unless-stopped
    ports:
      - "${PL_WEB_PORT:-8080}:8080"
    environment:
      PL_DB_HOST: db
      PL_DB_PORT: 3306
      PL_DB_NAME: phpledger
      PL_DB_USER: phpledger
      PL_DB_PASSWORD: ${PL_DB_PASSWORD:?Set PL_DB_PASSWORD}
      PL_PUBLIC_URL: ${PL_PUBLIC_URL:?Set PL_PUBLIC_URL to the public https URL Elestio assigns}
      # Set to 1 once, on the first start after pulling a newer image tag; leave
      # 0 for ordinary restarts. See SUBMISSION.md "Upgrade procedure".
      PL_AUTO_MIGRATE: ${PL_AUTO_MIGRATE:-0}
      # All three install the administrator from the environment on first start;
      # leave them unset to finish setup in the browser at /install instead.
      PL_ADMIN_EMAIL: ${PL_ADMIN_EMAIL:-}
      PL_ADMIN_NAME: ${PL_ADMIN_NAME:-}
      PL_ADMIN_USERNAME: ${PL_ADMIN_USERNAME:-}
      PL_ADMIN_PASSWORD: ${PL_ADMIN_PASSWORD:-}
      # A private setup key an operator can require before /install opens at
      # all; recommended once this is reachable from the public internet.
      PL_SETUP_KEY: ${PL_SETUP_KEY:-}
      PL_ALLOWED_ORIGINS: ${PL_ALLOWED_ORIGINS:-}
    volumes:
      - phpledger_private:/var/lib/phpledger
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    init: true
  db:
    image: mysql:8.4
    restart: unless-stopped
    # Simplifies trigger creation for the single account this compose file
    # grants every privilege to; see docs/INSTALLER.md for a narrower-privilege
    # alternative.
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: phpledger
      MYSQL_USER: phpledger
      MYSQL_PASSWORD: ${PL_DB_PASSWORD:?Set PL_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${PL_DB_ROOT_PASSWORD:?Set PL_DB_ROOT_PASSWORD}
    volumes:
      - phpledger_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  phpledger_data:
  phpledger_private:
