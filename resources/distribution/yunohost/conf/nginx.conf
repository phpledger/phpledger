#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  # Document root is the release's own www/phpledger/public/, not the
  # release root: includes/, storage/, install/, resources/ and tools/
  # live outside this alias and are never web-reachable.
  alias __INSTALL_DIR__/www/phpledger/public/;

  index index.php;
  client_max_body_size 50M;

  try_files $uri $uri/ __PATH__/index.php$is_args$args;

  location ~ [^/]\.php(/|$) {
    fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;
    include fastcgi_params_no_auth;
  }
}
