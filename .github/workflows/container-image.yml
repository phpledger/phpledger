name: Container image

# Step 9 of docs/RELEASE-PROTOCOL.md. Fires once a GitHub Release is published: the
# owner has already uploaded the signed archive over release.yml's draft asset and
# published it (release.yml itself never runs this - it only drafts). Downloads that
# exact published ZIP and its checksum, builds docker/release/Dockerfile from it
# (never from the working tree), and pushes to GHCR and Docker Hub (owner, 23 Sep 2026).
#
# Tags: <version>, <major>.<minor>, <major> and latest for a stable release; only
# <version> for a prerelease. latest never moves for a prerelease. Both registries
# are required. Docker Hub uses the existing DOCKERHUB_USERNAME/TOKEN credentials.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to build (e.g. v1.2.1)'
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: container-image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve the release tag and version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::No release tag was supplied."
            exit 1
          fi
          case "$TAG" in
            v*) version="${TAG#v}" ;;
            *) echo "::error::Tag $TAG does not start with v."; exit 1 ;;
          esac
          {
            echo "tag=$TAG"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Download the published release archive and checksum
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p build/release
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "phpledger-${VERSION}.zip" \
            --pattern "phpledger-${VERSION}.zip.sha256" \
            --dir build/release
          cd build/release
          sha256sum -c "phpledger-${VERSION}.zip.sha256"
          echo "sha256=$(cut -d' ' -f1 "phpledger-${VERSION}.zip.sha256")" >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Both DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are required for the two-registry release."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        # tools/container-image-tags.py (tests/container-tags-test.py) is the single
        # place that decides these suffixes, so "latest never moves for a prerelease"
        # is a tested function rather than inline shell arithmetic on a version string.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DOCKERHUB_ENABLED: ${{ steps.dockerhub.outputs.enabled }}
          DOCKERHUB_NAMESPACE: phpledger
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          images="$GHCR_IMAGE"
          if [ "$DOCKERHUB_ENABLED" = "true" ]; then
            images="$images $DOCKERHUB_NAMESPACE/phpledger"
          fi
          tags="$(python3 tools/container-image-tags.py "$VERSION" $images)"
          {
            echo "tags<<PL_TAGS_EOF"
            echo "$tags"
            echo "PL_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/release/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RELEASE_ZIP=build/release/phpledger-${{ steps.version.outputs.version }}.zip
            RELEASE_SHA256=${{ steps.archive.outputs.sha256 }}
          tags: ${{ steps.tags.outputs.tags }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@e98e4d1628a5f3be2be7c231e50981aee98723ae
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: phpledger/phpledger
          short-description: Open-source, self-hosted accounting and cash POS for small businesses

      - name: Record the published tags and digest
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### PHP Ledger container image published"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "Tags:"
            printf '%s\n' "$TAGS" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
