name: Foundation checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2.33', '8.3.33', '8.4.25']
    env:
      PL_PHP_VERSION: ${{ matrix.php }}
      PL_DB_PASSWORD: ci-local-only
      PL_DB_ROOT_PASSWORD: ci-local-root-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build the PHP ${{ matrix.php }} foundation
        run: docker compose --profile test build test
      - name: Validate the dependency manifest
        run: docker compose --profile test run --rm test composer validate --no-interaction
      - name: Audit locked public dependencies
        run: docker compose --profile test run --rm test composer audit --no-interaction
      - name: Verify actual runtime requirements
        run: docker compose --profile test run --rm test composer check-platform-reqs
      - name: Lint, static analysis, sample data, and isolated MySQL tests
        run: docker compose --profile test run --rm test
      - name: Verify release channels and package boundaries
        run: python3 tests/package-builder-test.py
      - name: Demo packs match their builder
        # The builder drifted from its own committed output once and nothing noticed,
        # because its check runs nowhere. A rebuild then broke all eleven packs. The
        # test image has no Python, so this belongs here rather than in composer check.
        run: python3 tools/build-demo-packs.py --check
      - name: Verify update modes, the version source and release-feed parsing
        run: docker compose --profile test run --rm test php tests/update-channel-test.php
      - name: Verify the phpledger.com release-feed generator
        run: node tests/release-feed-test.mjs && node www/website/releases-feed.mjs --check
      - name: Verify publisher signatures and download restrictions
        run: docker compose --profile test run --rm test php tests/release-signing-test.php
      - name: Verify guarded browser installation in a disposable schema
        run: docker compose --profile test run --rm test php tests/browser_installer_test.php
      - name: Verify keyless browser installation, username sign-in and logo upload
        run: docker compose --profile test run --rm test php tests/browser_installer_keyless_test.php
      - name: Verify signed update failure and resumable recovery
        run: docker compose --profile test run --rm test php tests/update-recovery-test.php
      - name: Verify database restoration and interruption replay
        run: docker compose --profile test run --rm test php tests/update-database-test.php
      - name: Verify full application schema automatic recovery
        run: docker compose --profile test run --rm test php tests/update-fullschema-test.php
      - name: Verify maintenance authorization and replacement runtime recovery
        run: docker compose --profile test run --rm test php tests/update-http-test.php
      - name: Verify the real migrate and verify phases under the copied recovery runtime
        run: docker compose --profile test run --rm test php tests/update-migrate-test.php
      - name: Verify a backup in an isolated restore database
        shell: pwsh
        run: ./tools/verify-backup-restore.ps1
      - name: Stop disposable CI services
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans

  php-mariadb:
    # XAMPP and most shared hosts provide MariaDB; the same schema and suites run through the dialect translation.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        database: ['mariadb:10.4', 'mariadb:10.6', 'mariadb:10.11', 'mariadb:11.4']
    env:
      PL_PHP_VERSION: '8.3.33'
      PL_TEST_DB_IMAGE: ${{ matrix.database }}
      PL_DB_PASSWORD: ci-local-only
      PL_DB_ROOT_PASSWORD: ci-local-root-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build the PHP foundation
        run: docker compose --profile test build test
      - name: Isolated tests on ${{ matrix.database }}
        run: docker compose --profile test run --rm test php tests/run.php
      - name: Browser installation on ${{ matrix.database }}
        run: docker compose --profile test run --rm test php tests/browser_installer_test.php
      - name: Keyless browser installation on ${{ matrix.database }}
        run: docker compose --profile test run --rm test php tests/browser_installer_keyless_test.php
      - name: Database recovery on ${{ matrix.database }}
        run: docker compose --profile test run --rm test php tests/update-database-test.php
      - name: Full schema recovery on ${{ matrix.database }}
        run: docker compose --profile test run --rm test php tests/update-fullschema-test.php
      - name: Maintenance recovery on ${{ matrix.database }}
        run: docker compose --profile test run --rm test php tests/update-http-test.php
      - name: Real migrate phase under the copied recovery runtime on ${{ matrix.database }}
        run: docker compose --profile test run --rm test php tests/update-migrate-test.php
      - name: Stop disposable CI services
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
