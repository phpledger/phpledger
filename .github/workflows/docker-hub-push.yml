name: Republish release images

# Preserve the operator entry point while delegating to the exact-release-ZIP
# publisher. A master/tag push must never replace a verified release image.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to republish to both registries
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: ./.github/workflows/container-image.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
