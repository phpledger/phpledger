map $http_x_forwarded_proto $demo_forwarded_proto {
    default $scheme;
    https https;
    http http;
}
server {
    listen 80;
    server_name _;
    client_max_body_size 8m;
    location / {
        proxy_pass http://demo-web:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $demo_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 40s;
        proxy_connect_timeout 3s;
    }
}
