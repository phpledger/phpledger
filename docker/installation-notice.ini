expose_php=Off
display_errors=Off
log_errors=Off
allow_url_fopen=Off
allow_url_include=Off
session.auto_start=0
session.use_cookies=0
max_execution_time=10
memory_limit=64M
post_max_size=16K
upload_max_filesize=1K
file_uploads=Off
disable_functions=exec,system,passthru,shell_exec,proc_open,popen,curl_exec,curl_multi_exec,mail
