<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/phpledger/www/phpledger/public
    <Directory /var/www/phpledger/www/phpledger/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
