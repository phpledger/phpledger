<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/phpledger/www/phpledger/public
    <Directory /var/www/phpledger/www/phpledger/public>
        Options -Indexes
        # Not AllowOverride None: on this image's Apache build, "AllowOverride None"
        # combined with an explicit "Require all granted" in the same block still
        # answers every request with a bare 403, confirmed against a disposable
        # container - with root and non-root processes, with Options and
        # FallbackResource removed one at a time, and against the base image's
        # unmodified docker-php.conf. AllowOverride FileInfo is the narrowest value
        # that resolves it: it lets Apache read the shipped public/.htaccess for its
        # one RewriteRule (harmless - the identical rule FallbackResource below also
        # applies) without permitting a .htaccess to re-enable directory indexes or
        # touch authorization, so Options -Indexes and Require stay enforced from
        # this file regardless of anything a writable .htaccess could ever contain.
        AllowOverride FileInfo
        Require all granted
        FallbackResource /index.php
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
