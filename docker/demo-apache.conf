<VirtualHost *:8080>
    ServerName localhost
    # The demo has one exact internal TLS-terminating proxy identity.
    # Never trust a forwarded scheme from another peer or an arbitrary header.
    SetEnvIfExpr "%{CONN_REMOTE_ADDR} == osenv('PL_TRUSTED_PROXY_IPS') && req('X-Forwarded-Proto') == 'https'" HTTPS=on
    DocumentRoot /var/www/phpledger/www/phpledger/public
    Alias /demo/ /var/www/phpledger/www/phpledger/public/
    <Directory /var/www/phpledger/www/phpledger/public>
        Options -Indexes
        # Match the production image's shipped public rewrite handling.
        AllowOverride FileInfo
        Require all granted
        FallbackResource /demo/index.php
    </Directory>
    <Directory /var/www/phpledger/www/phpledger/public/assets>
        FallbackResource disabled
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
